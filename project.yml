name: Taskami
options:
  bundleIdPrefix: com.koryashkin
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

targets:
  Taskami:
    type: application
    platform: iOS
    sources:
      - path: Taskami
    settings:
      base:
        INFOPLIST_GENERATION_MODE: GeneratedFile
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: com.koryashkin.taskami
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Unlock Taskami with Face ID"
    dependencies:
      - sdk: LocalAuthentication.framework

  TaskamiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TaskamiTests
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.koryashkin.taskami.tests
        CODE_SIGN_STYLE: Automatic
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Taskami.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Taskami"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Taskami

  TaskamiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TaskamiUITests
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.koryashkin.taskami.uitests
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: Taskami
    dependencies:
      - target: Taskami
